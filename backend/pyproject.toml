[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends()/Query() *must* be called in argument defaults —
# that's how the dependency-injection system works, not a bug. See FastAPI's
# own docs recommending exactly this pattern.
ignore = ["B008"]
