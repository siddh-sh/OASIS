name: Refresh slow-moving data (weekly)

# Biodiversity, genomics and fisheries sources publish on timescales of
# months to years (researchers submit occurrence records long after
# fieldwork; FAO fisheries statistics are annual and ~1.5 years behind).
# Polling these daily would be pure waste, so they refresh weekly.

on:
  schedule:
    # 03:30 UTC every Sunday
    - cron: "30 3 * * 0"
  workflow_dispatch:

# The commit step pushes refreshed seed CSVs back to the repo. Without this
# the default read-only token is refused (403) and every run fails after
# having already fetched the data.
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Job-level so the load steps' `if:` can see it (a step's own env is not
    # yet set when its condition is evaluated). Empty until the repository
    # secret is added, which skips those steps.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt

      # Order matters here: gbif.py reads species_occurrences_obis.csv to
      # decide which species to back-fill, so obis.py must succeed first.
      - name: Biodiversity (OBIS)
        timeout-minutes: 15
        continue-on-error: true
        run: python -u data-pipeline/collectors/obis.py

      - name: Biodiversity backfill (GBIF)
        timeout-minutes: 15
        continue-on-error: true
        run: python -u data-pipeline/collectors/gbif.py

      - name: Genomics (BOLD Systems)
        timeout-minutes: 20
        continue-on-error: true
        run: python -u data-pipeline/collectors/bold.py

      - name: Fisheries (FAO via OWID)
        timeout-minutes: 5
        continue-on-error: true
        run: python -u data-pipeline/collectors/fao_fisheries.py

      # FAO publishes the species-level release once a year (March); bump
      # RELEASE in the collector when a new one appears. Re-pulling the same
      # release is a no-op diff.
      - name: Fisheries species catch (FAO FishStat)
        timeout-minutes: 10
        continue-on-error: true
        run: python -u data-pipeline/collectors/fao_capture.py

      - name: Show what changed
        run: git --no-pager diff --stat -- data-pipeline/seeds/

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/seeds/
          if git diff --cached --quiet; then
            echo "No new data upstream — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): weekly refresh of biodiversity, genomics and fisheries data"
          git push

      # Seed CSVs in git are only half the job: the app reads the database.
      # Skipped (not failed) until a DATABASE_URL repository secret exists.
      # The loader is insert-only with ON CONFLICT DO NOTHING, so re-running
      # it just adds the rows that are new.
      - name: Load into database
        if: env.DATABASE_URL != ''
        run: python -u data-pipeline/cleaning/load_seeds.py

      # Sources like Sea Around Us and FAO supply names only; fill the blank
      # classification from GBIF/WoRMS before embedding, which uses it.
      - name: Backfill species taxonomy
        timeout-minutes: 15
        if: env.DATABASE_URL != ''
        continue-on-error: true
        run: python -u data-pipeline/cleaning/backfill_taxonomy.py

      # New species from OBIS/GBIF/FAO are invisible to the chatbot's species
      # search until they are embedded.
      - name: Re-embed species for chatbot retrieval
        if: env.DATABASE_URL != ''
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m app.agents.embeddings
