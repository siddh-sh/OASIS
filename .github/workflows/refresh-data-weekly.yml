name: Refresh slow-moving data (weekly)

# Biodiversity, genomics and fisheries sources publish on timescales of
# months to years (researchers submit occurrence records long after
# fieldwork; FAO fisheries statistics are annual and ~1.5 years behind).
# Polling these daily would be pure waste, so they refresh weekly.

on:
  schedule:
    # 03:30 UTC every Sunday
    - cron: "30 3 * * 0"
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt

      # Order matters here: gbif.py reads species_occurrences_obis.csv to
      # decide which species to back-fill, so obis.py must succeed first.
      - name: Biodiversity (OBIS)
        continue-on-error: true
        run: python -u data-pipeline/collectors/obis.py

      - name: Biodiversity backfill (GBIF)
        continue-on-error: true
        run: python -u data-pipeline/collectors/gbif.py

      - name: Genomics (BOLD Systems)
        continue-on-error: true
        run: python -u data-pipeline/collectors/bold.py

      - name: Fisheries (FAO via OWID)
        continue-on-error: true
        run: python -u data-pipeline/collectors/fao_fisheries.py

      - name: Show what changed
        run: git --no-pager diff --stat -- data-pipeline/seeds/

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/seeds/
          if git diff --cached --quiet; then
            echo "No new data upstream — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): weekly refresh of biodiversity, genomics and fisheries data"
          git push
