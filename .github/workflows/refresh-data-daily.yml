name: Refresh fast-moving data (daily)

# Satellite + sensor + weather sources publish on a daily-ish cadence, so
# these are worth re-pulling every day. See data-pipeline/collectors/window.py
# for each source's real publication lag — collectors compute rolling date
# windows, so this genuinely picks up new observations rather than
# re-fetching a frozen range.

on:
  schedule:
    # 02:30 UTC daily — after NOAA's overnight processing, off-peak for their servers
    - cron: "30 2 * * *"
  workflow_dispatch:        # lets anyone trigger a refresh by hand from the Actions tab

# The commit step pushes refreshed seed CSVs back to the repo. Without this
# the default read-only token is refused (403) and every run fails after
# having already fetched the data.
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false  # never interrupt a partial write to the seed files

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Job-level so the load steps' `if:` can see it (a step's own env is not
    # yet set when its condition is evaluated). Empty until the repository
    # secret is added, which skips those steps.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    timeout-minutes: 45      # PMEL's ERDDAP is slow; the buoy pull alone can take ~10 min

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r data-pipeline/requirements.txt

      # Each collector runs independently with continue-on-error so one
      # upstream outage (these are third-party public APIs) doesn't block
      # the others from refreshing.
      - name: Weather (Open-Meteo)
        continue-on-error: true
        run: python -u data-pipeline/collectors/open_meteo.py

      - name: Satellites (NOAA ERDDAP SST + chlorophyll)
        continue-on-error: true
        run: python -u data-pipeline/collectors/noaa_erddap.py

      - name: Sensors (NOAA PMEL RAMA buoys)
        continue-on-error: true
        run: python -u data-pipeline/collectors/rama_buoys.py

      - name: Show what changed
        run: git --no-pager diff --stat -- data-pipeline/seeds/

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-pipeline/seeds/
          if git diff --cached --quiet; then
            echo "No new data upstream — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): daily refresh of satellite, sensor and weather data"
          git push

      # Seed CSVs in git are only half the job: the app reads the database.
      # Skipped (not failed) until a DATABASE_URL repository secret exists.
      # The loader is insert-only with ON CONFLICT DO NOTHING, so re-running
      # it just adds the rows that are new.
      - name: Load into database
        if: env.DATABASE_URL != ''
        run: python -u data-pipeline/cleaning/load_seeds.py

      - name: Re-run anomaly detection on the new satellite data
        if: env.DATABASE_URL != ''
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m app.ml.anomalies
